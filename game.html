<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

	<title>AP Study Challenge | MyStuff</title>
	<style>

:root {
    --bg: #f5eee4;
    --cream: #fffaf2;
    --cream-dark: #f1e5d6;
    --ink: #34271f;
    --muted: #817166;
    --terracotta: #c96845;
    --rust: #a84d32;
    --peach: #f0d2bd;
    --caramel: #d8b68a;
    --green: #75846b;
    --line: #e8dbcc;
    --success: #39704e;
    --error: #ad4338;
    --shadow: 0 14px 35px rgba(65, 42, 26, .07);
}

* {
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    margin: 0;
    padding: clamp(1.2rem, 5vw, 4rem);
    color: var(--ink);
    background:
        radial-gradient(ellipse at 88% 7%, #edcfb8 0, transparent 24%),
        radial-gradient(ellipse at 0% 70%, #ead9c5 0, transparent 26%),
        var(--bg);
    font-family: "DM Sans", sans-serif;
    line-height: 1.65;
}

main {
    position: relative;
    width: min(100%, 820px);
    margin: 0 auto;
}

main > a {
    color: var(--muted);
    font-size: .85rem;
    font-weight: 600;
    text-decoration: none;
}

main > a:hover {
    color: var(--rust);
}

/* Editorial headline */
main > h1 {
    position: relative;
    max-width: 650px;
    margin: 2rem 0 .7rem;
    font-family: "DM Serif Display", Georgia, serif;
    font-size: clamp(3.1rem, 8vw, 5.5rem);
    font-weight: 400;
    letter-spacing: -.055em;
    line-height: 1.02;
}

main > h1::before {
    content: "A LITTLE PRACTICE, A LOT OF PROGRESS";
    display: block;
    margin-bottom: 1rem;
    color: var(--rust);
    font-family: "DM Sans", sans-serif;
    font-size: .7rem;
    font-weight: 800;
    letter-spacing: .16em;
    line-height: 1.5;
}

main > h1::after {
    content: "✳";
    display: inline-block;
    margin-left: .12em;
    color: var(--terracotta);
    font-family: "DM Sans", sans-serif;
    font-size: .43em;
    vertical-align: top;
    transform: rotate(-12deg);
}

main > p {
    max-width: 520px;
    margin: 1rem 0 2.5rem;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.85;
}

/* Main cards */
section {
    position: relative;
    margin-top: 1.5rem;
    padding: clamp(1.4rem, 4vw, 2.5rem);
    overflow: hidden;
    border: 1px solid rgba(222, 203, 182, .75);
    border-radius: 22px;
    background: var(--cream);
    box-shadow: var(--shadow);
}

section[hidden],
[hidden] {
    display: none !important;
}

h2 {
    margin: 0 0 1.5rem;
    font-family: "DM Serif Display", Georgia, serif;
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 400;
    letter-spacing: -.03em;
    line-height: 1.2;
}

#setup h2::after {
    content: " ✳";
    color: var(--terracotta);
    font-family: "DM Sans", sans-serif;
    font-size: .7em;
}

/* Decorative corner illustration */
#setup::before {
    content: "";
    position: absolute;
    top: -43px;
    right: -38px;
    width: 135px;
    height: 135px;
    border: 1px solid rgba(201, 104, 69, .3);
    border-radius: 50%;
    box-shadow:
        0 0 0 12px rgba(201, 104, 69, .06),
        0 0 0 25px rgba(201, 104, 69, .04);
    pointer-events: none;
}

#setup::after {
    content: "✦";
    position: absolute;
    top: 1.8rem;
    right: 2.3rem;
    color: var(--terracotta);
    font-size: 1.7rem;
    transform: rotate(12deg);
    pointer-events: none;
}

#setup h2,
#setup label,
#setup select,
#setup button {
    position: relative;
    z-index: 1;
}

label {
    display: block;
    margin-bottom: .65rem;
    color: var(--muted);
    font-size: .75rem;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
}

select,
button {
    width: 100%;
    min-height: 3.4rem;
    font: inherit;
}

#setup label {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

select {
    margin-bottom: 1.1rem;
    padding: .9rem 1rem;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fffdf9;
    color: var(--ink);
    cursor: pointer;
}

#setup output {
    padding: .15rem .6rem;
    border-radius: 999px;
    background: var(--peach);
    color: var(--rust);
    font-size: .8rem;
    letter-spacing: 0;
}

#setup input[type="range"] {
    display: block;
    width: 100%;
    margin: 0 0 1.1rem;
    accent-color: var(--terracotta);
    cursor: pointer;
}

select:focus-visible,
input[type="range"]:focus-visible,
button:focus-visible,
a:focus-visible {
    outline: 3px solid rgba(201, 104, 69, .45);
    outline-offset: 4px;
}

/* Signature buttons */
button {
    padding: .95rem 1.2rem;
    border: 1px solid transparent;
    border-radius: 12px;
    background: var(--terracotta);
    color: white;
    font-size: .92rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--rust);
    transition: transform .18s ease, background .18s ease,
                box-shadow .18s ease;
}

button:hover:not(:disabled) {
    background: var(--rust);
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #783822;
}

button:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 2px 0 #783822;
}

button:disabled {
    background: #d7c9bc;
    color: #75675c;
    box-shadow: none;
    cursor: wait;
}

/* Quiz: the main visual focus */
#game {
    border: 1px solid #e8d8c7;
    background:
        radial-gradient(circle at 100% 0%, rgba(240, 210, 189, .32), transparent 28%),
        var(--cream);
}

#progress {
    display: flex;
    align-items: center;
    margin: 0 0 1.7rem;
    padding: 0 0 1rem;
    border-bottom: 1px solid var(--line);
    color: var(--rust);
    font-size: .75rem;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
}

#question {
    position: relative;
    margin: 0 0 1.7rem;
    padding: 1.4rem 1.5rem;
    border: 1px solid #eddfd0;
    border-radius: 16px;
    background: #fffdf9;
    font-family: "DM Serif Display", Georgia, serif;
    font-size: clamp(1.55rem, 4vw, 2.15rem);
    font-weight: 400;
    letter-spacing: -.025em;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

#question::first-letter {
    color: var(--ink);
}

#answers {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: .85rem;
}

#answers button {
    position: relative;
    display: flex;
    align-items: flex-start;
    min-height: 5.2rem;
    padding: 1rem;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fffdf9;
    color: var(--ink);
    font-size: .92rem;
    font-weight: 500;
    line-height: 1.6;
    text-align: left;
    overflow-wrap: anywhere;
    box-shadow: none;
}

#answers button:nth-child(4n + 1) {
    border-bottom: 3px solid #d58b69;
}

#answers button:nth-child(4n + 2) {
    border-bottom: 3px solid #d8b68a;
}

#answers button:nth-child(4n + 3) {
    border-bottom: 3px solid #a7ae91;
}

#answers button:nth-child(4n) {
    border-bottom: 3px solid #c88d78;
}

#answers button:hover:not(:disabled) {
    border-color: var(--terracotta);
    background: #fff3e8;
    color: var(--rust);
    box-shadow: none;
    transform: translateY(-2px);
}

#answers button:disabled {
    opacity: 1;
    cursor: default;
    box-shadow: none;
}

#feedback {
    min-height: 1.5rem;
    margin: 1.4rem 0 1rem;
    color: var(--success);
    font-size: .92rem;
    font-weight: 700;
}

#feedback.incorrect {
    color: var(--error);
}

#game #next {
    background: var(--ink);
    box-shadow: 0 4px 0 #1e1712;
}

#game #next:hover:not(:disabled) {
    background: #514035;
}

/* Completion screen */
#results {
    text-align: center;
    padding-block: clamp(2.2rem, 7vw, 4rem);
    background:
        radial-gradient(circle at 50% 0%, rgba(240, 210, 189, .6), transparent 42%),
        var(--cream);
}

#results h2::before {
    content: "✳ ";
    color: var(--terracotta);
    font-family: "DM Sans", sans-serif;
}

#score {
    margin: 1.3rem 0 2rem;
    color: var(--rust);
    font-family: "DM Serif Display", Georgia, serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
}

#next,
#play-again {
    margin-top: .5rem;
}

#play-again {
    max-width: 280px;
}

/* Small screens */
@media (max-width: 600px) {
    body {
        padding: 1.25rem 1rem 2rem;
    }

    main > h1 {
        font-size: clamp(2.8rem, 12vw, 4rem);
    }

    main > p {
        margin-bottom: 1.8rem;
    }

    section {
        padding: 1.25rem;
        border-radius: 17px;
    }

    #setup::before {
        width: 100px;
        height: 100px;
    }

    #setup::after {
        top: 1.5rem;
        right: 1.5rem;
    }

    #answers {
        grid-template-columns: 1fr;
    }

    #answers button {
        min-height: 3.8rem;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition: none !important;
    }
}


.study-doodle {
    display: flex;
    justify-content: flex-end;
    height: 0;
    margin-top: -1.5rem;
    margin-bottom: 1.5rem;
    padding-right: 1rem;
    pointer-events: none;
}

.study-doodle svg {
    width: 135px;
    height: auto;
    overflow: visible;
    transform: rotate(3deg);
}

@media (max-width: 600px) {
    .study-doodle {
        margin-top: -.5rem;
        margin-bottom: 1.3rem;
    }

    .study-doodle svg {
        width: 100px;
    }
}
/* Flashcard behind the home button */
main > a {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.7rem 1rem;
    margin: 0.4rem 0 1.5rem 0.4rem;
    color: var(--ink);
    background: var(--cream);
    border: 1px solid #e4d2bd;
    border-radius: 3px;
    box-shadow:
        4px 4px 0 var(--caramel),
        7px 7px 0 rgba(168, 77, 50, 0.12);
    font-size: 0.85rem;
    font-weight: 700;
    text-decoration: none;
    transform: rotate(-2deg);
    transition: transform 180ms ease, box-shadow 180ms ease;
}

/* Tiny decorative star */
main > a::before {
    content: "✳";
    color: var(--terracotta);
    font-size: 1.05rem;
    line-height: 1;
}

main > a:hover {
    transform: translateY(-2px) rotate(0deg);
    box-shadow:
        5px 6px 0 var(--caramel),
        8px 9px 0 rgba(168, 77, 50, 0.12);
}

main > a:focus-visible {
    outline: 3px solid var(--terracotta);
    outline-offset: 5px;
}
</style>
</head>

		const setup = document.querySelector('#setup');
		const game = document.querySelector('#game');
		const results = document.querySelector('#results');
		const questionEl = document.querySelector('#question');
		const answersEl = document.querySelector('#answers');
		const feedbackEl = document.querySelector('#feedback');
		const progressEl = document.querySelector('#progress');
        const questionCountInput = document.querySelector('#question-count');
        const difficultyInput = document.querySelector('#difficulty');
        questionCountInput.addEventListener('input', () => {
            document.querySelector('#question-count-value').textContent = questionCountInput.value;
        });
        difficultyInput.addEventListener('input', () => {
            document.querySelector('#difficulty-value').textContent = difficultyInput.value;
        });
		let questions = [];
		let current = 0;
		let score = 0;

		async function startGame() {
    const courseSelect = document.querySelector('#course');
    const course = courseSelect.selectedOptions[0].textContent.trim();
    const startButton = document.querySelector('#start');

    try {
        startButton.disabled = true;
        startButton.textContent = "Generating questions...";

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                topic: course,
                count: Number(questionCountInput.value),
                difficulty: Number(difficultyInput.value)
            })
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || `Question generation failed (${response.status}).`);
        }

        console.log("API response:", data);

        if (!Array.isArray(data.questions) || data.questions.length === 0) {
            throw new Error("The question generator returned no questions.");
        }
        if (data.questions.length !== Number(questionCountInput.value)) {
            throw new Error("The question generator returned an unexpected number of questions. Please try again.");
        }

        questions = data.questions.map((question, index) => {
            if (
                typeof question.question !== "string" ||
                !Array.isArray(question.choices) ||
                question.choices.length !== 4 ||
                !question.choices.every(choice => typeof choice === "string") ||
                !Number.isInteger(question.answer) ||
                question.answer < 0 ||
                question.answer >= question.choices.length
            ) {
                throw new Error(`The question generator returned an invalid question (${index + 1}).`);
            }

            return {
                q: question.question,
                a: question.choices,
                correct: question.answer
            };
        });

        current = 0;
        score = 0;

        setup.hidden = true;
        results.hidden = true;
        game.hidden = false;

        showQuestion();

    } catch (err) {
        console.error(err);
        alert(err instanceof Error ? err.message : "Failed to generate questions.");
    } finally {
        startButton.disabled = false;
        startButton.textContent = "Start game";
    }
}

		function showQuestion() {
			const item = questions[current];
			progressEl.textContent = `Question ${current + 1} of ${questions.length} · Score: ${score}`;
			questionEl.textContent = item.q;
			feedbackEl.textContent = '';
			feedbackEl.classList.remove('incorrect');
			answersEl.replaceChildren();
			document.querySelector('#next').hidden = true;
			item.a.forEach((answer, index) => {
				const button = document.createElement('button');
				button.type = 'button';
				button.textContent = answer;
				button.addEventListener('click', () => chooseAnswer(index));
				answersEl.append(button);
			});
		}

		function chooseAnswer(index) {
			const item = questions[current];
			const buttons = answersEl.querySelectorAll('button');
			buttons.forEach(button => button.disabled = true);
			if (index === item.correct) {
				score++;
				feedbackEl.textContent = 'Correct!';
			} else {
				feedbackEl.textContent = `Not quite. Correct answer: ${item.a[item.correct]}`;
				feedbackEl.classList.add('incorrect');
			}
			progressEl.textContent = `Question ${current + 1} of ${questions.length} · Score: ${score}`;
			document.querySelector('#next').hidden = false;
		}

		function nextQuestion() {
			current++;
			if (current < questions.length) {
				showQuestion();
			} else {
				game.hidden = true;
				results.hidden = false;
				document.querySelector('#score').textContent = `You scored ${score} out of ${questions.length}.`;
			}
		}

		document.querySelector('#start').addEventListener('click', startGame);
		document.querySelector('#next').addEventListener('click', nextQuestion);
		document.querySelector('#play-again').addEventListener('click', () => {
			results.hidden = true;
			setup.hidden = false;
		});

	</script>
